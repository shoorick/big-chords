<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twinkle twinkle little star</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/split.js" defer></script>
  </head>
  <body>
    <h1>Twinkle twinkle little star</h1>
    <div class="chord-size-control">
      Chord size
      <button
        type="button"
        id="chord-size-decrease"
        aria-label="Shrink chords">
        −
      </button>
      <output id="chord-size-value" aria-live="polite">2</output>
      <button
        type="button"
        id="chord-size-increase"
        aria-label="Enlarge chords">
        +
      </button>
    </div>
    <pre data-chord-lines>C                 F      С 
Twinkle, twinkle, little star,
F     C      G        C
How I wonder what you are!
C   F        C        G
Up above the world so high,
C      F       C      G
Like a diamond in the sky.</pre>
  </body>
</html>
